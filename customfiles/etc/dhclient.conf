# override broadcast address because Linuxisms
# use external DNS so that packages are fetched from regional mirror
interface "lagg0" {
  supersede broadcast-address 255.255.255.255;
  supersede domain-name-servers 9.9.9.9;
}

interface "ice0" {
  supersede broadcast-address 255.255.255.255;
  supersede domain-name-servers 9.9.9.9;
}

interface "ix0" {
  supersede broadcast-address 255.255.255.255;
  supersede domain-name-servers 9.9.9.9;
}
